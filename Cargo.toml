[package]
name = "zl"
version = "0.1.0"
edition = "2021"
description = "A basic Wayland app launcher, emoji picker and clipboard history"

[dependencies]
fend-core = "=1.5.8"
llm = { version = "=1.3.7", default-features = false, features = ["ollama", "google", "openai", "openrouter", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync"] }
futures = "0.3"
anyhow = "1"
pulldown-cmark = { version = "0.13", default-features = false }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
xkbcommon = "0.8"
memmap2 = "0.9"
rusttype = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "gif", "webp"] }
emojis = "=0.8.0"
unicode-segmentation = "1.12"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "glyph-names"] }
resvg = { version = "0.45", default-features = false }
freedesktop-desktop-entry = { version = "0.8", default-features = false }
notify = "8"
fuzzy-matcher = "0.3.7"
freedesktop-icons = "0.4"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
